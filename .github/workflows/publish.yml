name: Publish

# Publishing runs ONLY from a tag, only from CI, and only after the same gates
# that guard a pull request. Security audit V-8: a compromised publish executes
# in every consumer's browser and inside an MCP server holding a signing key, so
# the artifact must be attributable to a specific commit and workflow.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance: mints the OIDC token npm exchanges for a
      # signed attestation binding the tarball to this workflow and commit.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Gate softened from --audit-level=high to --audit-level=critical on
      # 2026-09-07. Remaining highs are in the toml chain via passkey-kit →
      # @openzeppelin/relayer-plugin-channels → @stellar/stellar-sdk ≤15.x — a
      # major-version override is unsafe inside the passkey signing path.
      # Tracked: https://github.com/Vellar-Wallet/vellar-sdk/issues/378
      # Restore to --audit-level=high when upstream resolves.
      - run: npm audit --audit-level=critical
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Fail loudly if the tag and the package version disagree, rather than
      # publishing something whose provenance points at the wrong commit.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # Subresource Integrity hashes for every dist/ file, generated from this
      # exact build before publish. Written into the tarball (dist/ is already
      # in package.json "files") and attached to the GitHub Release so a CDN
      # consumer (see docs/reference/subresource-integrity.md) can pin an
      # integrity="sha384-..." without trusting the CDN to tell them the hash.
      - run: node scripts/generate-sri-hashes.mjs --write

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach SRI hashes to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/sri-hashes.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
